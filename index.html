<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iHack Audio Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;700;900&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .tech-border {
        position: relative;
      }
      .tech-border::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      }
      @keyframes scan {
        0% { background-position: 0% 0%; }
        100% { background-position: 0% 100%; }
      }
      .animate-scan {
        background: linear-gradient(to bottom, transparent, rgba(16, 185, 129, 0.1), transparent);
        background-size: 100% 50%;
        animation: scan 2s linear infinite;
      }
      .text-glow-purple {
        text-shadow: 4px 4px 15px rgba(168, 85, 247, 0.5), -2px -2px 10px rgba(168, 85, 247, 0.2);
      }
      .background-glow {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: -1;
        background: 
          radial-gradient(circle at 30% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 40%),
          radial-gradient(circle at 70% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
        filter: blur(80px);
        animation: pulse-glow 15s ease-in-out infinite alternate;
      }
      @keyframes pulse-glow {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.1); opacity: 0.8; }
      }
      .box-glow-hover:hover {
        box-shadow: 0 0 60px var(--tw-shadow-color);
        background: rgba(15, 23, 42, 0.6);
      }

      /* Premium Cyber Glowing Hover Animations */
      @keyframes neon-glow-pulse {
        0% {
          box-shadow: 0 0 15px rgba(6, 182, 212, 0.4), 0 0 30px rgba(6, 182, 212, 0.2), inset 0 0 10px rgba(6, 182, 212, 0.1);
        }
        50% {
          box-shadow: 0 0 25px rgba(6, 182, 212, 0.8), 0 0 50px rgba(6, 182, 212, 0.4), inset 0 0 15px rgba(6, 182, 212, 0.2);
        }
        100% {
          box-shadow: 0 0 15px rgba(6, 182, 212, 0.4), 0 0 30px rgba(6, 182, 212, 0.2), inset 0 0 10px rgba(6, 182, 212, 0.1);
        }
      }

      @keyframes glow-amber-pulse {
        0% {
          box-shadow: 0 0 15px rgba(245, 158, 11, 0.4), 0 0 30px rgba(245, 158, 11, 0.2), inset 0 0 10px rgba(245, 158, 11, 0.1);
        }
        50% {
          box-shadow: 0 0 25px rgba(245, 158, 11, 0.8), 0 0 50px rgba(245, 158, 11, 0.4), inset 0 0 15px rgba(245, 158, 11, 0.2);
        }
        100% {
          box-shadow: 0 0 15px rgba(245, 158, 11, 0.4), 0 0 30px rgba(245, 158, 11, 0.2), inset 0 0 10px rgba(245, 158, 11, 0.1);
        }
      }

      @keyframes glow-emerald-pulse {
        0% {
          box-shadow: 0 0 15px rgba(16, 185, 129, 0.4), 0 0 30px rgba(16, 185, 129, 0.2), inset 0 0 10px rgba(16, 185, 129, 0.1);
        }
        50% {
          box-shadow: 0 0 25px rgba(16, 185, 129, 0.8), 0 0 50px rgba(16, 185, 129, 0.4), inset 0 0 15px rgba(16, 185, 129, 0.2);
        }
        100% {
          box-shadow: 0 0 15px rgba(16, 185, 129, 0.4), 0 0 30px rgba(16, 185, 129, 0.2), inset 0 0 10px rgba(16, 185, 129, 0.1);
        }
      }

      @keyframes glow-pink-pulse {
        0% {
          box-shadow: 0 0 15px rgba(236, 72, 153, 0.4), 0 0 30px rgba(236, 72, 153, 0.2), inset 0 0 10px rgba(236, 72, 153, 0.1);
        }
        50% {
          box-shadow: 0 0 25px rgba(236, 72, 153, 0.8), 0 0 50px rgba(236, 72, 153, 0.4), inset 0 0 15px rgba(236, 72, 153, 0.2);
        }
        100% {
          box-shadow: 0 0 15px rgba(236, 72, 153, 0.4), 0 0 30px rgba(236, 72, 153, 0.2), inset 0 0 10px rgba(236, 72, 153, 0.1);
        }
      }

      @keyframes border-flicker {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.3; }
      }

      /* Interactive Neon Glow Utility Styles */
      .glow-hover-cyan:hover {
        animation: neon-glow-pulse 2s infinite ease-in-out;
        border-color: rgba(6, 182, 212, 0.8) !important;
        background: rgba(8, 47, 73, 0.4) !important;
        text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
      }

      .glow-hover-amber:hover {
        animation: glow-amber-pulse 2s infinite ease-in-out;
        border-color: rgba(245, 158, 11, 0.8) !important;
        background: rgba(120, 53, 4, 0.3) !important;
        text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
      }

      .glow-hover-emerald:hover {
        animation: glow-emerald-pulse 2s infinite ease-in-out;
        border-color: rgba(16, 185, 129, 0.8) !important;
        background: rgba(6, 78, 59, 0.3) !important;
        text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
      }

      .glow-hover-pink:hover {
        animation: glow-pink-pulse 2s infinite ease-in-out;
        border-color: rgba(236, 72, 153, 0.8) !important;
        background: rgba(131, 24, 67, 0.3) !important;
        text-shadow: 0 0 10px rgba(236, 72, 153, 0.5);
      }

      /* Glowing Animated Border for Interactive Nodes */
      .glowing-node-card {
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
      }
      
      .glowing-node-card::after {
        content: '';
        position: absolute;
        inset: -1px;
        background: linear-gradient(90deg, #06b6d4, #a855f7, #10b981, #f59e0b);
        border-radius: inherit;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      
      .glowing-node-card:hover::after {
        opacity: 0.3;
      }

      .glowing-node-card:hover {
        transform: translateY(-4px) scale(1.01);
        box-shadow: 0 10px 30px -10px rgba(6, 182, 212, 0.3);
      }
    </style>

}
</script>

</html>
